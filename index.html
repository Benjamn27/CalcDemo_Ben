<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Super Duper Cool Calculator</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>Calc - Short For Calculator</h1>

    <div class="calculator">
      <div class="image">
        <img src ="pexels-lily-66739371-9384358.jpg" alt="lizard that watches" width="200">
      </div>
      <input type="text" id="result" readonly />
      <div class="buttons">
        <button class="clear">Be Gone, Numbers!</button>
        <button class="operator">/</button>
        <button class="operator">*</button>
        <button class="operator">-</button>
        <button class="number">8</button>
        <button class="number">5</button>
        <button class="number">4</button>
        <button class="operator">+</button>
        <button class="number">9</button>
        <button class="number">1</button>
        <button class="number">7</button>
        <button class="equals">Gimme Answer!</button>
        <button class="number">6</button>
        <button class="number">3</button>
        <button class="number">2</button>
        <button class="number">0</button>
        <button class="number">27</button>
        <button class="decimal">.</button>
      </div>
    </div>
    <div>
      Links to other versions:
      <ul>
        <li><a href="./index.html">Fully Featured</a></li>
        <li><a href="./pages/plainHTML.html">Just HTML</a></li>
        <li><a href="./pages/addCSS.html">HTML+CSS</a></li>
        <li><a href="./pages/addJS.html">HTML+JS</a></li>
        <li><a href="https://www.desmos.com/calculator">The Grapher</a></li>
      </ul>
    </div>
    <script src="index.js"></script>
  </body>
</html>
